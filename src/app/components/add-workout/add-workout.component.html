<app-navbar></app-navbar>

<div
  class="max-w-md mx-auto mt-10 p-8 bg-gradient-to-r from-blue-900 to-blue-600 text-white rounded-lg shadow-lg animate-fadeIn"
>
  <h2 class="text-2xl font-bold text-center mb-6">Add Workout</h2>

  <form
    [formGroup]="workoutForm"
    (ngSubmit)="submitWorkout()"
    class="flex flex-col space-y-4"
  >
    <div>
      <label class="block text-gray-200 mb-1">Name</label>
      <input
        type="text"
        formControlName="name"
        required
        class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-900 focus:border-blue-500 focus:ring-blue-300 transition"
      />
    </div>

    <div>
      <label class="block text-gray-200 mb-1">Type</label>
      <input
        type="text"
        formControlName="type"
        required
        class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-900 focus:border-blue-500 focus:ring-blue-300 transition"
      />
    </div>

    <div>
      <label class="block text-gray-200 mb-1">Duration (minutes)</label>
      <input
        type="number"
        formControlName="duration"
        required
        class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-900 focus:border-blue-500 focus:ring-blue-300 transition"
      />
    </div>

    <div>
      <label class="block text-gray-200 mb-1">Calories Burned</label>
      <input
        type="number"
        formControlName="calories"
        required
        class="w-full p-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-900 focus:border-blue-500 focus:ring-blue-300 transition"
      />
    </div>

    <button
      type="submit"
      [disabled]="workoutForm.invalid"
      class="w-full p-3 bg-blue-600 text-white font-bold rounded-lg transition transform hover:bg-blue-800 hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed"
    >
      Add Workout
    </button>
  </form>
</div>
